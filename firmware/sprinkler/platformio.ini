; Caretaker AI: sprinkler valve controller firmware
;   Flash over USB:   pio run -t upload
;   Serial monitor:   pio device monitor
;   Flash over Wi-Fi: pio run -e esp32-ota -t upload

[platformio]
default_envs = esp32

[env]
; pioarduino: the maintained ESP32 platform with Arduino core 3.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7.2.0

[env:esp32]

[env:esp32-ota]
upload_protocol = espota
; Host (<DEVICE_HOSTNAME>.local) and --auth come from include/config.h, see scripts/ota_auth.py.
extra_scripts = pre:scripts/ota_auth.py
; The ESP32 connects back to this computer on this port to download the image,
; so allow it in the firewall (deploy/install.sh does this for ufw).
upload_flags = --host_port=8266
