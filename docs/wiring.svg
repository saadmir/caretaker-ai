<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#0f172a">Sprinkler controller wiring: ESP32 → SRD-05VDC-SL-C relay module → 24 VAC valve</text>

  <!-- zones -->
  <rect x="20" y="70" width="560" height="440" rx="14" fill="#f1f5f9"/>
  <text x="36" y="94" font-size="12" font-weight="700" fill="#475569" letter-spacing="1">5 V DC LOGIC SIDE</text>
  <rect x="590" y="70" width="350" height="440" rx="14" fill="#eff6ff"/>
  <text x="606" y="94" font-size="12" font-weight="700" fill="#1d4ed8" letter-spacing="1">24 VAC VALVE SIDE (isolated)</text>

  <!-- ESP32 -->
  <rect x="40" y="140" width="200" height="240" rx="10" fill="#1e293b"/>
  <text x="140" y="172" fill="#fff" font-weight="700" text-anchor="middle">ESP32 DevKit</text>
  <text x="140" y="190" fill="#94a3b8" font-size="12" text-anchor="middle">ESP-WROOM-32</text>
  <g fill="#e2e8f0" font-size="13" text-anchor="end">
    <text x="228" y="205">VIN (5V)</text>
    <text x="228" y="255">GND</text>
    <text x="228" y="305">GPIO 26 (D26)</text>
  </g>
  <g fill="#fbbf24"><circle cx="240" cy="200" r="5"/><circle cx="240" cy="250" r="5"/><circle cx="240" cy="300" r="5"/></g>
  <rect x="120" y="372" width="40" height="16" rx="3" fill="#64748b"/>
  <line x1="140" y1="388" x2="140" y2="440" stroke="#0f172a" stroke-width="4"/>
  <rect x="85" y="440" width="110" height="44" rx="8" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <text x="140" y="460" text-anchor="middle" font-size="12" font-weight="700">USB 5 V charger</text>
  <text x="140" y="476" text-anchor="middle" font-size="11" fill="#475569">≥1 A, micro-USB</text>

  <!-- Relay module -->
  <rect x="360" y="140" width="200" height="240" rx="10" fill="#1d4ed8"/>
  <text x="460" y="172" fill="#fff" font-weight="700" text-anchor="middle">1-ch relay module</text>
  <text x="460" y="190" fill="#bfdbfe" font-size="12" text-anchor="middle">SRD-05VDC-SL-C</text>
  <g fill="#fff" font-size="13">
    <text x="372" y="205">VCC / DC+</text>
    <text x="372" y="255">GND / DC−</text>
    <text x="372" y="305">IN</text>
  </g>
  <g fill="#fff" font-size="13" text-anchor="end">
    <text x="548" y="205">NO</text>
    <text x="548" y="265">COM</text>
    <text x="548" y="325">NC</text>
  </g>
  <g fill="#fbbf24"><circle cx="360" cy="200" r="5"/><circle cx="360" cy="250" r="5"/><circle cx="360" cy="300" r="5"/></g>
  <g fill="#e2e8f0" stroke="#0f172a"><circle cx="560" cy="200" r="6"/><circle cx="560" cy="260" r="6"/><circle cx="560" cy="320" r="6"/></g>
  <text x="548" y="345" font-size="11" fill="#bfdbfe" text-anchor="end">(unused)</text>

  <!-- logic wires -->
  <line x1="245" y1="200" x2="355" y2="200" stroke="#dc2626" stroke-width="4"/>
  <line x1="245" y1="250" x2="355" y2="250" stroke="#0f172a" stroke-width="4"/>
  <line x1="245" y1="300" x2="355" y2="300" stroke="#f59e0b" stroke-width="4"/>
  <g font-size="11" fill="#475569" text-anchor="middle">
    <text x="300" y="192">red</text><text x="300" y="242">black</text><text x="300" y="292">signal</text>
  </g>

  <!-- Valve -->
  <rect x="680" y="150" width="180" height="110" rx="10" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <text x="770" y="185" text-anchor="middle" font-weight="700">Sprinkler valve</text>
  <text x="770" y="204" text-anchor="middle" font-size="12" fill="#475569">24 VAC solenoid</text>
  <text x="770" y="222" text-anchor="middle" font-size="12" fill="#475569">(2 wires, either way)</text>
  <circle cx="680" cy="200" r="5" fill="#0f172a"/><circle cx="860" cy="230" r="5" fill="#0f172a"/>

  <!-- Transformer -->
  <rect x="680" y="350" width="180" height="110" rx="10" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <text x="770" y="385" text-anchor="middle" font-weight="700">24 VAC transformer</text>
  <text x="770" y="404" text-anchor="middle" font-size="12" fill="#475569">plug-in, ≥ 0.75 A / 18 VA</text>
  <text x="770" y="422" text-anchor="middle" font-size="12" fill="#475569">AC output — not DC</text>
  <circle cx="680" cy="400" r="5" fill="#0f172a"/><circle cx="860" cy="420" r="5" fill="#0f172a"/>
  <text x="692" y="448" font-size="11" fill="#475569">A</text><text x="842" y="448" font-size="11" fill="#475569">B</text>
  <line x1="770" y1="460" x2="770" y2="530" stroke="#0f172a" stroke-width="3"/>
  <text x="770" y="550" text-anchor="middle" font-size="12" font-weight="700">120 V wall outlet</text>
  <text x="770" y="566" text-anchor="middle" font-size="11" fill="#475569">(no mains wiring needed)</text>

  <!-- 24VAC wires -->
  <line x1="566" y1="200" x2="675" y2="200" stroke="#2563eb" stroke-width="4"/>
  <polyline points="566,260 620,260 620,400 675,400" fill="none" stroke="#2563eb" stroke-width="4"/>
  <rect x="608" y="280" width="24" height="44" rx="4" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <text x="640" y="298" font-size="11" fill="#475569">1 A fuse</text>
  <text x="640" y="312" font-size="11" fill="#475569">(optional)</text>
  <polyline points="865,420 905,420 905,230 865,230" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <text x="912" y="330" font-size="11" fill="#475569" transform="rotate(90 912 330)" text-anchor="middle">valve common</text>

  <text x="30" y="535" font-size="12" fill="#334155">Relay is a switch only: it does NOT convert voltage. The transformer makes 24 VAC; the relay connects it to the valve.</text>
  <text x="30" y="553" font-size="12" fill="#334155">Never connect any 24 VAC wire to the ESP32. The relay contacts are the only link between the two sides.</text>
</svg>
